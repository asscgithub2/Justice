<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>পণ্যের তালিকা</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bar">
        DEMO
    </div>

    <!-- ヘッダー -->
    <header>
        <a class="logo" href="index.html">
            🥬 কৃষক বাজার
            <small> FARMERS MARKET</small>
        </a>

        <nav>
            <a href="index.html">ব্যবহারকারীর নির্বাচনে ফিরে যান</a>
            <button type="button" id="open-cart" class="cart-nav-btn">
                🛒কার্ট দেখুন(See cart)  (<span id="cart-count">0</span>)
            </button>
        </nav>
    </header>

    <!-- 商品一覧 -->
    <main class="wrap">

        <div class="listhead">
            <div>
                <p class="eyebrow">OUR PRODUCTS</p>
                <h2>বর্তমানে বিক্রয়ের জন্য তালিকাভুক্ত পণ্য</h2>
            </div>
        </div>

        <!-- 商品がここに表示される -->
        <div id="product-list" class="products"></div>

    </main>

    <!-- カート表示モーダル -->
    <div id="cart-modal" class="modal" hidden>
        <div class="modal-backdrop" id="close-cart-bg"></div>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
            <div class="modal-head">
                <h2 id="cart-title">🛒 শপিং কার্ট(cart)</h2>
                <button type="button" id="close-cart" class="close-btn" aria-label="閉じる">✕</button>
            </div>
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-total">মোট পরিমাণ：<strong id="cart-total">¥0</strong></div>
                <div class="actions">
                    <button type="button" id="clear-cart" class="btn light">আপনার কার্ট খালি করুন</button>
                    <button type="button" id="checkout-btn" class="btn">অর্ডার নিশ্চিত করা হয়েছে →</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
